name: test cli

on:
  push:
    branches: [main, "fix/windows-*"]
  pull_request:
    paths: ["cli/**", "plugins/claude-run/skills/usage-report/**", ".github/workflows/*cli.yml"]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm test --prefix cli
